<rect x="68" y="366" width="226" height="40" rx="12" fill="#ffffff" fill-opacity=".04" stroke="#2a2a44"/><text x="86" y="392" fill="#3ef0b0">$ <tspan fill="#f3f2ff">pip install shad0wllm</tspan></text>
