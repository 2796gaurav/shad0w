<text x="68" y="252" font-family="'Geist','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="600" fill="#ffffff">your LLM's answers, served in <tspan fill="#fca311">2.4 µs</tspan>.</text>
<text x="68" y="300" font-family="'Geist','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#e5e5e5">Learns what your LLM decides. Answers what it's certified on.</text>
<text x="68" y="328" font-family="'Geist','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#e5e5e5">Sends the rest to your LLM, and keeps learning.</text>
