<rect x="68" y="366" width="226" height="40" rx="12" fill="#ffffff" fill-opacity=".04" stroke="#14213d"/><text x="86" y="392" fill="#fca311">$ <tspan fill="#ffffff">pip install shad0wllm</tspan></text>
