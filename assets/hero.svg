<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-label="shad0w: requests flow in; the certified table answers most in microseconds, the rest go to your LLM.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07070c"/><stop offset="1" stop-color="#11111e"/></linearGradient>
<radialGradient id="au1" cx=".75" cy=".2" r=".6"><stop offset="0" stop-color="#3ef0b0" stop-opacity=".22"/><stop offset="1" stop-color="#3ef0b0" stop-opacity="0"/></radialGradient>
<radialGradient id="au2" cx=".95" cy=".9" r=".5"><stop offset="0" stop-color="#8b7bff" stop-opacity=".25"/><stop offset="1" stop-color="#8b7bff" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#2a2a44" stroke-opacity=".35"/></pattern>
<path id="pin" d="M 700 230 C 740 230, 760 230, 790 230"/>
<path id="pt" d="M 860 230 C 920 230, 930 120, 1010 120 L 1110 120"/>
<path id="pl" d="M 860 230 C 920 230, 920 345, 985 345"/>
</defs>
<rect width="1280" height="460" rx="28" fill="url(#bg)"/>
<rect width="1280" height="460" rx="28" fill="url(#grid)"/>
<rect width="1280" height="460" rx="28" fill="url(#au1)"/><rect width="1280" height="460" rx="28" fill="url(#au2)"/>
<text x="64" y="190" font-family="'Space Grotesk','Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-weight="700" font-size="112" fill="#f3f2ff" letter-spacing="-2">shad</text><circle cx="348.3" cy="153.0" r="30.2" fill="none" stroke="#3ef0b0" stroke-width="9.5" filter="url(#glow)"/><circle cx="348.3" cy="153.0" r="6.2" fill="#3ef0b0"/><text x="384.1" y="190" font-family="'Space Grotesk','Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-weight="700" font-size="112" fill="#f3f2ff" letter-spacing="-2">w</text>
<text x="68" y="252" font-family="'Space Grotesk','Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="600" fill="#f3f2ff">your LLM's answers, served in <tspan fill="#3ef0b0">10 µs</tspan>.</text>
<text x="68" y="300" font-family="'Space Grotesk','Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#a09fbd">Learns what your LLM decides. Answers what it's certified on.</text>
<text x="68" y="328" font-family="'Space Grotesk','Inter','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="20" fill="#a09fbd">Sends the rest to your LLM, and keeps learning.</text>
