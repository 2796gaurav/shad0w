<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 460" width="1280" height="460" role="img" aria-label="shad0w: requests flow in; the certified table answers most in microseconds, the rest go to your LLM.">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#000000"/><stop offset="1" stop-color="#14213d"/></linearGradient>
<radialGradient id="au1" cx=".78" cy=".22" r=".45"><stop offset="0" stop-color="#fca311" stop-opacity=".16"/><stop offset="1" stop-color="#fca311" stop-opacity="0"/></radialGradient>
<radialGradient id="au2" cx=".95" cy=".9" r=".5"><stop offset="0" stop-color="#14213d" stop-opacity=".6"/><stop offset="1" stop-color="#14213d" stop-opacity="0"/></radialGradient>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#14213d" stroke-opacity=".35"/></pattern>
<path id="pin" d="M 700 230 C 740 230, 760 230, 790 230"/>
<path id="pt" d="M 860 230 C 920 230, 930 120, 1010 120 L 1110 120"/>
<path id="pl" d="M 860 230 C 920 230, 920 345, 985 345"/>
