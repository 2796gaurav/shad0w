<circle r="4" fill="#fca311" filter="url(#glow)"><animateMotion path="M 944 150 l 26 0" dur="1.5s" begin="4.0s" repeatCount="indefinite"/></circle>
<g transform="translate(976 42)">
<rect width="272" height="216" rx="22" fill="#ffffff" fill-opacity=".03" stroke="#14213d"/>
<rect width="272" height="216" rx="22" fill="none" stroke="#fca311" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;1;0;0" keyTimes="0;.1;.25;1" dur="6s" begin="4.5s" repeatCount="indefinite"/></rect>
<circle cx="40" cy="44" r="20" fill="#fca311" fill-opacity=".15"/><text x="40" y="51" text-anchor="middle" font-family="'Geist','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#fca311">4</text>
<text x="74" y="54" font-family="'Geist','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="30" font-weight="700" fill="#ffffff" letter-spacing="-.5">Serve</text>
<text x="24" y="108" font-family="'Geist','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#e5e5e5">certified: 2.4 µs locally</text>
<text x="24" y="132" font-family="'Geist','Segoe UI',Roboto,Helvetica,Arial,sans-serif" font-size="17" fill="#e5e5e5">unsure: your LLM, logged</text>
<rect x="24" y="158" width="141" height="34" rx="10" fill="#fca311" fill-opacity=".12"/>
<text x="38" y="181" font-family="'Geist Mono',SFMono-Regular,Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#fca311">source=table</text></g>
</svg>