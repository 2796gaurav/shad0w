<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="Four steps: shadow, compile, certify, serve">
<defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06060b"/><stop offset="1" stop-color="#0e0b1f"/></linearGradient>
<pattern id="grid2" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity="0.035"/></pattern></defs>
<style>.t{font-family:Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;fill:#ecebff}.m{font-family:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace}</style>
<rect width="1280" height="300" rx="22" fill="url(#bg2)"/><rect width="1280" height="300" rx="22" fill="url(#grid2)"/>
<g transform="translate(40,50)">
  <rect width="270" height="200" rx="18" fill="#11112a" stroke="#8b6cff" stroke-opacity="0.9" stroke-width="1.5">
    <animate attributeName="stroke-opacity" dur="8s" repeatCount="indefinite" keyTimes="0.000;0.249;0.250;1.000" values="1;1;0.5;0.5"/></rect>
  <g><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0.000;0.249;0.250;1.000" values="1;1;0.5;0.5"/>
  <text x="24" y="46" class="t m" font-size="15" style="fill:#8b6cff">01</text>
  <text x="24" y="92" class="t" font-size="30" font-weight="700">Shadow</text>
  <text x="24" y="132" class="t" font-size="16" style="fill:#8a8aa3">your model keeps serving;</text>
  <text x="24" y="156" class="t" font-size="16" style="fill:#8a8aa3">its answers are logged</text></g>
</g>
<path d="M 316 150.0 h 28" stroke="#8b6cff" stroke-width="2" marker-end="none"/><path d="M 340 144.0 l 8 6 l -8 6" stroke="#8b6cff" stroke-width="2" fill="none"/>
<g transform="translate(350,50)">
  <rect width="270" height="200" rx="18" fill="#11112a" stroke="#a78bfa" stroke-opacity="0.9" stroke-width="1.5">
    <animate attributeName="stroke-opacity" dur="8s" repeatCount="indefinite" keyTimes="0.000;0.249;0.250;0.499;0.500;1.000" values="0.5;0.5;1;1;0.5;0.5"/></rect>
  <g><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0.000;0.249;0.250;0.499;0.500;1.000" values="0.5;0.5;1;1;0.5;0.5"/>
  <text x="24" y="46" class="t m" font-size="15" style="fill:#a78bfa">02</text>
  <text x="24" y="92" class="t" font-size="30" font-weight="700">Compile</text>
  <text x="24" y="132" class="t" font-size="16" style="fill:#8a8aa3">a 2 MB int8 table,</text>
  <text x="24" y="156" class="t" font-size="16" style="fill:#8a8aa3">no tokenizer, any CPU</text></g>
</g>
<path d="M 626 150.0 h 28" stroke="#a78bfa" stroke-width="2" marker-end="none"/><path d="M 650 144.0 l 8 6 l -8 6" stroke="#a78bfa" stroke-width="2" fill="none"/>
<g transform="translate(660,50)">
  <rect width="270" height="200" rx="18" fill="#11112a" stroke="#22d3ee" stroke-opacity="0.9" stroke-width="1.5">
    <animate attributeName="stroke-opacity" dur="8s" repeatCount="indefinite" keyTimes="0.000;0.499;0.500;0.749;0.750;1.000" values="0.5;0.5;1;1;0.5;0.5"/></rect>
  <g><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0.000;0.499;0.500;0.749;0.750;1.000" values="0.5;0.5;1;1;0.5;0.5"/>
  <text x="24" y="46" class="t m" font-size="15" style="fill:#22d3ee">03</text>
  <text x="24" y="92" class="t" font-size="30" font-weight="700">Certify</text>
  <text x="24" y="132" class="t" font-size="16" style="fill:#8a8aa3">Learn-then-Test: disagreement</text>
  <text x="24" y="156" class="t" font-size="16" style="fill:#8a8aa3">with your model ≤ α</text></g>
</g>
<path d="M 936 150.0 h 28" stroke="#22d3ee" stroke-width="2" marker-end="none"/><path d="M 960 144.0 l 8 6 l -8 6" stroke="#22d3ee" stroke-width="2" fill="none"/>
<g transform="translate(970,50)">
  <rect width="270" height="200" rx="18" fill="#11112a" stroke="#34d399" stroke-opacity="0.9" stroke-width="1.5">
    <animate attributeName="stroke-opacity" dur="8s" repeatCount="indefinite" keyTimes="0.000;0.749;0.750;0.999;1.000" values="0.5;0.5;1;1;0.5"/></rect>
  <g><animate attributeName="opacity" dur="8s" repeatCount="indefinite" keyTimes="0.000;0.749;0.750;0.999;1.000" values="0.5;0.5;1;1;0.5"/>
  <text x="24" y="46" class="t m" font-size="15" style="fill:#34d399">04</text>
  <text x="24" y="92" class="t" font-size="30" font-weight="700">Serve</text>
  <text x="24" y="132" class="t" font-size="16" style="fill:#8a8aa3">certified → µs, in-process;</text>
  <text x="24" y="156" class="t" font-size="16" style="fill:#8a8aa3">the rest → your model</text></g>
</g>
<text x="640.0" y="278" class="t" font-size="14" text-anchor="middle" style="fill:#8a8aa3">the deferred answers are logged too, so the share the table can certify grows with traffic: 31% → 70% on AG News</text></svg>