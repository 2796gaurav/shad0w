# Publishes a tagged release: wheels with the C core for every major platform, the sdist, the npm package and a
# GitHub Release. PyPI and npm both use Trusted Publishing (OIDC), so no publishing token is stored anywhere.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  wheels:
    name: wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pypa/cibuildwheel@v2.22
        env:
          CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-*"
          CIBW_SKIP: "*-musllinux_* *-win32 *-manylinux_i686"
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_TEST_REQUIRES: numpy
          CIBW_TEST_COMMAND: >-
            python -c "import shad0w.native as n; assert n.available(), 'C core missing from wheel'; print(n.find_library())"
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: pip install build twine && python -m build --sdist && twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  pypi:
    needs: [wheels, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/shad0wllm/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  npm:
    # npm Trusted Publishing (OIDC): no token is stored. Configure it once on npmjs.com:
    # package shad0wllm -> Settings -> Trusted Publisher -> GitHub Actions, repo 2796gaurav/shad0w, workflow release.yml
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - run: npm install -g npm@latest   # trusted publishing needs npm >= 11.5.1
      - run: cd js && npm publish --access public   # provenance is attached automatically with trusted publishing

  npm-trust-check:
    # Manual runs only: proves npm Trusted Publishing is configured for this workflow by exchanging the GitHub
    # OIDC token for a short-lived npm publish token. Nothing is published and the token is never printed.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Exchange the GitHub OIDC token with npm
        run: |
          oidc=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                 "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r .value)
          code=$(curl -sS -o r.json -w '%{http_code}' -X POST -H "Authorization: Bearer $oidc" \
                 https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/shad0wllm)
          echo "npm OIDC exchange: HTTP $code"
          jq 'del(.token)' r.json 2>/dev/null || true
          if [ "$code" = 200 ] || [ "$code" = 201 ]; then echo "Trusted publishing is configured."; else exit 1; fi

  github-release:
    needs: [pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Release notes from CHANGELOG.md
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## "v {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --title "shad0w $v" --notes-file notes.md --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
