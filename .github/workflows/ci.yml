name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - uses: actions/setup-node@v7
        with: { node-version: "20" }
      - name: Install (CPU-only torch, builds the C core)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
      - name: C core is loaded
        run: python -c "import shad0w.native as n; assert n.available(), 'C core missing'; print(n.find_library())"
      - name: Lint
        run: ruff check shad0w tests examples
      - name: Tests
        run: python -m pytest -q
      - name: Quickstart
        run: python examples/quickstart.py
      - name: Node example
        run: node examples/node_decide.js examples/out/bundle "my card was stolen"
      - name: Runtime imports only numpy
        shell: bash
        run: |
          python -m venv rt
          RT=$( [ -f rt/bin/python ] && echo rt/bin/python || echo rt/Scripts/python )
          $RT -m pip install -q numpy
          $RT -c "import sys; sys.path.insert(0, '.'); import shad0w; m = shad0w.load('examples/out/bundle', native=False); print(m.decide('my card was stolen')['answers']['intent']['choice']); bad = [k for k in sys.modules if k.split('.')[0] in ('torch', 'sklearn', 'scipy', 'sentence_transformers')]; assert not bad, bad"

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install build twine && python -m build && twine check dist/*
      - run: cd js && npm pack --dry-run
